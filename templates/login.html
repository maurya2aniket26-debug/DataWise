<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - DataWise</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-page">


    <div class="auth-container">

        <div class="auth-logo">
            DATA<span>WISE</span>
        </div>

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="auth-description">
                Login to continue to DataWise.
            </p>


            <!-- FLASH MESSAGES -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST"
                  action="{{ url_for('login') }}">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >


                <button type="submit"
                        class="primary-btn full-width">
                    Login
                </button>

            </form>


            <p class="auth-bottom">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create Account
                </a>

            </p>


            <a href="{{ url_for('index') }}"
               class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


</body>

</html>
